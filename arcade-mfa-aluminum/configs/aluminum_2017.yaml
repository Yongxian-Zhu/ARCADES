# arcade_aluminum_package/configs/aluminum_2017.yaml
# 2017 U.S. aluminum MFA run configuration.
#
# AUTHORITATIVE SOURCE ENFORCEMENT:
#   `data.source_name` below MUST match an entry in AUTHORITATIVE_2017_SOURCES
#   (src/arcade_mfa_aluminum/adapters/aluminum/adapter.py). The loader raises
#   NonAuthoritative2017SourceError if it does not.

run:
  name: aluminum_2017_baseline
  year: 2017
  seed: 42

data:
  workbook_path: data/raw/aluminum/US aluminum flows.xlsx
  source_name: "2017 data"           # authoritative workbook sheet
  n_flows: 234
  n_internal_nodes: 62

formulation:
  type: flow_based
  space: linear            # decision variables are flow magnitudes, in linear space

prior:
  enabled: false           # 2017 is the baseline year -- no prior transfer applied

# Mass balance is imposed as a RELAXED accounting constraint, not as exact
# equality. Reported statistics from different sources are mutually
# inconsistent, so forcing residuals to zero would hide that inconsistency
# inside the flow estimates instead of reporting it. Residuals are penalized
# relative to node throughput, so one relative tolerance is meaningful across a
# network spanning several orders of magnitude:
#     sigma_i = rel_sigma * (node throughput from a MAP warm-up)
# Residuals are reported in kt/y and as a percentage of throughput.
# mode: hard reproduces exact equality for comparison.
# Relative trust between observation sources. A multiplier below 1 tightens a
# source's likelihood sigma (more trusted), above 1 loosens it. Every reported
# value is used regardless; weighting decides how strongly each one pulls, so
# disagreements between sources are reconciled rather than resolved by
# discarding data. Sources not listed here take a multiplier of 1.0.
observation_sources: {}

# Per-flow uncertainty overrides, with justification recorded alongside.
# Scrap exports are customs-tracked at the HS-code level and are among the
# best-measured quantities in the system; the source-level pedigree score does
# not distinguish them from modelled quantities reported by the same source.
# Trade flows are recorded at the border by customs declaration rather than
# estimated, so they are better measured than a source-level pedigree score
# implies. 5% relative sigma is applied to every observed cross-border flow,
# matching the treatment in configs/aluminum_2022.yaml so the transferred prior
# is built on the same weighting the target year uses.
#
# Import flows whose 2017 value is exactly 0.0 are deliberately NOT included.
# Tightening a reported zero asserts confidence that the category is absent,
# which customs silence does not establish; those rows keep their pedigree-based
# sigma.
observation_overrides:
  - flow_idx: 26            # EOL scrap (generated) -> Export EOL scrap
    relative_sigma: 0.05
    justification: customs-tracked scrap export, better measured than the source-level score implies
  - flow_idx: 1             # Import of bauxite -> Bauxite
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 5             # Import alumina -> Primary smelting
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 13            # Import unwrought aluminum ingot -> Remelting
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 14            # Import unwrought aluminum ingot -> Refining
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 25            # Import scrap -> EOL scrap (generated)
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 131           # Import mill semifinished products -> Rolling
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 133           # Import mill semifinished products -> Drawing
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 136           # Import mill semifinished products -> Foil
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 138           # Import mill semifinished products -> Wire
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 140           # Import mill semifinished products -> Powder & Paste
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 202           # Import finished consumption -> Building & construction
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 203           # Import finished consumption -> Transportation auto
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 204           # Import finished consumption -> Transportation other
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 205           # Import finished consumption -> Machine & industry
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 206           # Import finished consumption -> Electrical & equipment
    relative_sigma: 0.05
    justification: customs-tracked trade flow
  - flow_idx: 207           # Import finished consumption -> Consumer durables
    relative_sigma: 0.05
    justification: customs-tracked trade flow

mass_balance:
  mode: soft
  rel_sigma: 0.01            # 1% of node throughput

bounds:
  observed_lower_frac: 0.2   # x_lb = 0.2 * y_obs  (from notebook)
  observed_upper_frac: 1.8
  # Room given to a flow reported as exactly zero, in kt/y. A reported zero
  # usually means "not measured" or "below reporting threshold" rather than
  # "provably absent", so it is not pinned to a numerically negligible
  # interval. Set to 0 for a hard zero.
  zero_flow_upper: 1.0   # x_ub = 1.8 * y_obs

observation_sigma:
  # workbook "2017 data" sheet uses a 3-dimension pedigree matrix
  # (coverage/frequency/spatial boundary per USGS value) -- handled by
  # priors.quality_sigma.sigma_obs_from_pedigree via pipeline._ingest_2017.
  scale: "pedigree"
  # Every knob below is forwarded to adapters.aluminum.adapter.pedigree_to_rel_sigma.
  # This block IS the baseline case used by scripts/run_pedigree_sensitivity.py;
  # see configs/pedigree_mapping.yaml for the full sweep grid and
  # docs/pedigree_sensitivity.md for the review workflow.
  pedigree_mapping:
    scale_max: 4.0
    sigma_rel_best: 0.05
    sigma_rel_worst: 1.0
    global_multiplier: 1.0
    combiner: geometric_mean       # geometric_mean | arithmetic_mean | max | weighted_mean
    # The workbook scores 4 = highest confidence. Verified against the data:
    # directly reported trade statistics score 4/3/4 while a mass-balance-
    # derived flow scores 1/1/4, so a larger score must mean better evidence.
    direction: higher_is_better    # higher_is_better | lower_is_better

inference:
  method: truncated_gibbs   # truncated_gibbs (respects bounds and mass balance) | laplace_nullspace (legacy; can emit out-of-bounds draws)
  map:
    method: trust-constr
    maxiter: 20000            # generous cap; with the exact Hessian the solve converges on xtol well inside it
  sampling:
    # These draws are not only this run's output: output.save_prior_for_transfer
    # turns their sample covariance into the entire 2022 prior. A sample
    # covariance needs many more draws than dimensions to be stable, so keep the
    # draw count well above the ~160 estimated dimensions.
    n_chains: 4
    n_draws: 2000
    n_tune: 2000              # burn-in sweeps discarded per chain
    thin: 5                   # keep every 5th sweep: coordinate Gibbs is autocorrelated

diagnostics:
  compute_node_balance: true
  compute_convergence_summary: true
  output_dir: runs/aluminum_2017_baseline

output:
  posterior_mean_csv: runs/aluminum_2017_baseline/posterior_mean.csv
  posterior_samples_npy: runs/aluminum_2017_baseline/posterior_samples.npy
  save_prior_for_transfer: true
  transfer_inflation_factor: 1.5
  # Node allocation ratios (how each branching node splits its throughput),
  # exported for use as soft constraints in the 2022 run.
  # See src/arcade_mfa_aluminum/allocation.py.
  save_allocation_shares: true
  allocation_shares_out: data/canonical/aluminum/allocation_shares_2017.npz
  allocation_min_outflows: 2
  prior_mean_out: data/canonical/aluminum/prior_mean_2017_to_2022.npy
  prior_cov_out: data/canonical/aluminum/prior_cov_2017_to_2022.npy
